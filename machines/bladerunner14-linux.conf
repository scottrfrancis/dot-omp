# BladeRunner14, Kubuntu 26.04 (internal install, user scott). Applied after settings.conf.
#
# modelRoles is a RECORD: `omp config set modelRoles.default X` fails ("Unknown setting"),
# so it is set whole, as JSON.
#
# Default is dev-ai (always on, no local GPU or battery cost), which is what this machine has
# actually run since 2026-11-06. The local llama.cpp tier is opt-in: start it with omp-local
# and pass --model llama.cpp/qwen3.6-35b-a3b-mtp, or flip "default" here when offline.
#
# Every role stays on the default. omp here is the offline, local tier of the toolset; the
# cloud tier is a separate Claude Code session, reached by handing it the omp transcript, so
# nothing in this file names anthropic.
modelRoles {"default":"dev-ai/workhorse","smol":"@default","commit":"@default","plan":"@default","task":"@default"}

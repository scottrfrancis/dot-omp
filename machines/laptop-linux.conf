# Primary Linux dev laptop, Kubuntu 26.04. Applied after settings.conf.
# The hostname-to-machine-name mapping lives in the ops knowledge base (infra/coding.md),
# not here: this repo is public, so machine files carry roles, not names.

# modelRoles is a RECORD: `omp config set modelRoles.default X` fails ("Unknown setting"),
# so it is set whole, as JSON.
#
# Role policy (Scott, 2026-11-23): Studio's oMLX under the alias `coder` is reserved for
# directed, interactive coding; every routine role (smol, commit, plan, task) runs on
# dev-ai's `workhorse`. Same split as Hazel, OpenClaw and the beaufort jobs, which all
# default to workhorse (okf-knowledge infra/coding.md, infra/runbooks/studio-local-ai.md D4).
#
# The local llama.cpp tier is opt-in either way: omp-local starts the server and binds omp
# to it with --model, so nothing here changes for a flight.
modelRoles {"default":"studio/coder","smol":"dev-ai/workhorse","commit":"dev-ai/workhorse","plan":"dev-ai/workhorse","task":"dev-ai/workhorse"}

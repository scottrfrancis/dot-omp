# Employer-managed MacBook Pro (macOS 26.7, M4 Pro, 24 GiB). Applied after settings.conf with
# `./install.sh --copy --machine managed-mac` (the managed box cannot write /etc/hosts, so step 3
# of okf-knowledge infra/coding.md edits the copied models.yml baseUrls to the addresses).
#
# modelRoles is a RECORD, set whole as JSON (see bladerunner14-linux.conf). Role policy
# (Scott, 2026-11-23): default `studio/coder` for directed coding, every routine role on
# dev-ai's `workhorse`. Pure client: no local server on an employer-managed device, and
# 24 GiB could not carry the fleet's models anyway.
modelRoles {"default":"studio/coder","smol":"dev-ai/workhorse","commit":"dev-ai/workhorse","plan":"dev-ai/workhorse","task":"dev-ai/workhorse"}

# Employer-managed MacBook Pro (macOS 26.7, M4 Pro, 24 GiB). Applied after settings.conf
# with `./install.sh --copy --machine managed-mac` (the managed box cannot write
# /etc/hosts, so the setup procedure in okf-knowledge infra/coding.md edits the copied
# models.yml baseUrls to the LAN addresses). The hostname-to-machine-name mapping lives in
# that KB page; this repo is public, so machine files carry roles, not names.
#
# modelRoles is a RECORD, set whole as JSON (see laptop-linux.conf). Role policy
# (Scott, 2026-11-23): default `studio/coder` for directed coding, every routine role on
# dev-ai's `workhorse`. Pure client: no local server on an employer-managed device, and
# 24 GiB could not carry the fleet's models anyway.
modelRoles {"default":"studio/coder","smol":"dev-ai/workhorse","commit":"dev-ai/workhorse","plan":"dev-ai/workhorse","task":"dev-ai/workhorse"}

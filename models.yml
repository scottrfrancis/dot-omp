# dot-omp shared providers: symlinked (or copied) to ~/.omp/agent/models.yml by install.sh.
#
# Every provider lives here, machine-agnostic, like dot-opencode's opencode.jsonc: a
# provider a given machine can't reach is simply never used. WHICH model a machine uses
# is per-machine and lives in machines/<host>-<os>.conf (modelRoles), not here.
#
# Tiers (same three as dot-opencode):
#   1. local  - on this machine: llama.cpp (Linux, below), LM Studio (Windows; omp's
#               built-in lm-studio provider auto-discovers localhost:1234, no entry needed)
#   2. remote - dev-ai, the single-model inference box (below)
#   3. cloud  - anthropic, built in; log in with /login in the TUI (OAuth, Claude Pro/Max)
providers:
  # Remote tier: dev-ai's vLLM, the production primary since 2026-10-20 (okf-knowledge
  # infra/ai-stack.md, infra/model-upgrade-playbook.md). vLLM serves one model under two
  # names: `workhorse`, the pointer dev-ai moves when its primary changes, and
  # `qwen27-nvfp4`, pinned to nvidia/Qwen3.8-27B-NVFP4 for evals that must not drift.
  # 131072 context, MTP(3), tool parser qwen3_coder, reasoning parser qwen3.
  # Ollama on :11434 has been CPU-only since the cutover: a client left there gets a slow
  # copy at a 32K window and no error.
  dev-ai:
    baseUrl: http://dev-ai.local:8000/v1
    auth: none
    api: openai-completions
    models:
      - id: workhorse
        name: Workhorse (dev-ai primary, vLLM)
        contextWindow: 131072     # vLLM --max-model-len
        maxTokens: 16384
        input: [text]
      - id: qwen27-nvfp4
        name: Qwen3.8 27B NVFP4 (dev-ai vLLM, pinned)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]

  # Local tier on the Linux laptop (BladeRunner14): llama.cpp llama-server, started on
  # demand with `systemctl --user start llama-qwen36`. Qwen3.6-35B-A3B MTP on the
  # RTX 4070 8 GB, about 46 t/s decode on Balanced. See REBUILD-NOTES §4 (L1 to L6).
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    auth: none
    api: openai-completions
    models:
      - id: qwen3.6-35b-a3b-mtp   # must match llama-server --alias
        name: Qwen3.6 35B-A3B MTP (local)
        contextWindow: 131072     # match llama-server --ctx-size
        maxTokens: 16384
        input: [text]

  # Local tier on Studio (Mac Studio M5 Max, 128 GB): oMLX, an MLX server, on 8080.
  #   OMLX_API_KEY=... omlx serve --model-dir /Volumes/workspace/models/mlx --host 0.0.0.0 \
  #     --port 8080 --memory-guard-gb 100 --paged-ssd-cache-dir /Volumes/workspace/models/omlx-cache --headless
  # It listens on the LAN, so it requires its API key on every request, loopback included.
  # The key is in Studio's login Keychain; omp reads it from the OMLX_API_KEY variable:
  #   export OMLX_API_KEY="$(security find-generic-password -s omlx-api-key -w)"
  # oMLX names each model after its folder, so the ids below are folder names. It serves
  # several models at once and evicts by LRU. Plan and results: okf-knowledge
  # infra/runbooks/studio-local-ai.md. Same port as the llama.cpp entry; each machine only
  # runs one of them.
  omlx:
    baseUrl: http://127.0.0.1:8080/v1
    apiKey: OMLX_API_KEY
    api: openai-completions
    models:
      - id: Qwen3.6-35B-A3B-4bit
        name: Qwen3.6 35B-A3B 4-bit (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: gpt-oss-20b-MXFP4-Q8
        name: gpt-oss 20B (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: Qwen3.6-35B-A3B-oQ4e-mtp
        name: Qwen3.6 35B-A3B oQ4e with MTP (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      # Phase 2b and the Phase 3 bake-off (studio-local-ai.md). Listed ahead of their
      # downloads; a model oMLX has not discovered just fails if chosen.
      - id: Qwen3.8-27B-MLX-8bit
        name: Qwen3.8 27B 8-bit, dense (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: Qwen3.5-122B-A10B-4bit
        name: Qwen3.5 122B-A10B 4-bit (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: gpt-oss-120b-MXFP4-Q8
        name: gpt-oss 120B (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: Qwen3-Coder-Next-4bit
        name: Qwen3 Coder Next 4-bit (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-MLX-4bit
        name: Nemotron 3.5 Super-VL 120B-A12B 4-bit (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: Laguna-S-2.1-NVFP4-mlx
        name: Laguna S 2.1 NVFP4 (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: Mistral-Small-4-119B-2603-4bit
        name: Mistral Small 4 119B 4-bit (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: Qwen3.8-Flash-Next-oQ4e-mtp
        name: Qwen3.8 Flash-Next oQ4e with MTP (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      # Round 2 (studio-local-ai.md): speculative decoding, and Qwen3.8-27B at two quants.
      - id: Qwen3.8-Flash-Next-oQ2.5e-fp16-mtp
        name: Qwen3.8 Flash-Next oQ2.5e with MTP (oMLX)
        # 160k: under oMLX's 100 GiB guard a 190k prompt fits and 230k is aborted (2026-11-09).
        contextWindow: 163840
        maxTokens: 16384
        input: [text]
      - id: NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
        name: Nemotron 3.5 Super-VL NVFP4 with MTP (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
      - id: Qwen3.8-27B-oQ8e-mtp
        name: Qwen3.8 27B oQ8e with MTP (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]

  # The same oMLX server, with gpt-oss marked as a reasoning model. omp sends reasoning_effort only
  # for a model marked `reasoning: true`, and then sends its default level, high; oMLX passes it into
  # gpt-oss's chat template, which otherwise defaults to medium. Kept apart from `omlx` so round 1's
  # medium-effort results stay comparable (okf-knowledge studio-local-ai.md, round 2).
  omlx-high:
    baseUrl: http://127.0.0.1:8080/v1
    apiKey: OMLX_API_KEY
    api: openai-completions
    models:
      - id: gpt-oss-120b-MXFP4-Q8
        name: gpt-oss 120B, reasoning high (oMLX)
        contextWindow: 131072
        maxTokens: 16384
        input: [text]
        reasoning: true

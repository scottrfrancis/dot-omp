# dot-omp shared settings, applied on every machine by install.sh as `omp config set <key> <value>`.
# One setting per line: <key> <value>. The value is the rest of the line (JSON for records).
# omp owns ~/.omp/agent/config.yml and rewrites it itself, so it is NOT symlinked into this
# repo (a symlinked file that the tool rewrites leaves the checkout dirty).

# Edit tool syntax. ESSENTIAL for local and open models. omp's default "hashline" syntax
# had 11 of 20 edits rejected with Qwen3.6; with "replace", 0 of 4 failed, 14 turns
# instead of 36, 165 s instead of 260 s (USB trial, 2026-09-24). Also passed the
# 2026-09-29 smoke test on the internal install: 28/28 tests, 0 edit rejections.
edit.mode replace

# Look and feel, the same everywhere.
theme.dark titanium
theme.light light
symbolPreset unicode

# Approval. omp's default is yolo: every tool call runs unprompted. On 2026-11-08 a yolo
# session debugging a printer on BladeRunner14 submitted nine print jobs, changed a queue
# URI and ran sudo 245 times without asking. `write` lets reads run free and asks before
# writes, edits and commands. For code inside a git repo, pass --approval-mode yolo for
# that session. extensions/side-effect-gate.ts asks for the dangerous verbs in every mode.
tools.approvalMode write

# Keep each compaction handoff summary on disk so a long session can be audited afterwards.
# The printer session compacted six times; the first fired one minute after the finding
# that turned out to be the root cause, and the finding lost its priority in the summary.
compaction.handoffSaveToDisk true

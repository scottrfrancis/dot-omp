# dot-omp shared settings, applied on every machine by install.sh as `omp config set <key> <value>`.
# One setting per line: <key> <value>. The value is the rest of the line (JSON for records).
# omp owns ~/.omp/agent/config.yml and rewrites it itself, so it is NOT symlinked into this
# repo (a symlinked file that the tool rewrites leaves the checkout dirty).

# Edit tool syntax. ESSENTIAL for local and open models. omp's default "hashline" syntax
# had 11 of 20 edits rejected with Qwen3.6; with "replace", 0 of 4 failed, 14 turns
# instead of 36, 165 s instead of 260 s (USB trial, 2026-09-24). Also passed the
# 2026-09-29 smoke test on the internal install: 28/28 tests, 0 edit rejections.
edit.mode replace

# Look and feel, the same everywhere.
theme.dark titanium
theme.light light
symbolPreset unicode

# Approval. omp's default is yolo: every tool call runs unprompted. On 2026-11-08 a yolo
# session debugging a printer on the Linux laptop submitted nine print jobs, changed a queue
# URI and ran sudo 245 times without asking. `write` lets reads run free and asks before
# writes, edits and commands. extensions/side-effect-gate.ts asks for the dangerous verbs in
# every mode, including inside ssh payloads.
tools.approvalMode write

# `write` alone asks before EVERY bash command, which is unusable for fleet ops: the
# 2026-11-23 managed-Mac setup session approved roughly one prompt per tool call. bash.patterns
# closes that: ordered glob rules, first match wins, only `*` wildcards; `deny`/`prompt`
# rules are checked against the whole command and every segment, so they outrank `allow`
# even inside compounds. The rulebook below allows read-only utilities (including grep, rg,
# fd and find, whose destructive forms `-delete`/`-exec`/`-ok` are prompt rules of their
# own), macOS inspection verbs (plutil -p, diskutil list, system_profiler, scutil --get,
# tmutil listlocalsnapshots, brew list/info), git (minus the history-destroying forms), LAN
# ops (ssh/scp/rsync/curl), this repo's installers, and the omp/keychain/klipper CLIs.
# Anything unmatched still lands on the normal exec-tier prompt, and the side-effect gate
# keeps printing, packages, services, and remote sudo dead regardless. python is allowed by
# Scott on 2026-11-23 (linters, JSON and table work was prompting constantly); the shapes that
# reach a shell or delete trees (`os.system`, `os.popen`, `subprocess`, `shutil.rmtree`) stay
# prompt rules, so the allow does not become a bypass lane. `node`, `zsh -c`, `xargs`,
# `timeout` and `env VAR=1 cmd` are still NOT allowed, each being arbitrary execution.
bash.patterns [{"match":"git push*--force*","approval":"prompt"},{"match":"git push* -f*","approval":"prompt"},{"match":"git reset --hard*","approval":"prompt"},{"match":"git clean*","approval":"prompt"},{"match":"sed* -i*","approval":"prompt"},{"match":"curl*|*sh*","approval":"prompt"},{"match":"curl*|*bash*","approval":"prompt"},{"match":"find*-delete*","approval":"prompt"},{"match":"find* -exec *","approval":"prompt"},{"match":"find* -ok *","approval":"prompt"},{"match":"python*os.system*","approval":"prompt"},{"match":"python*os.popen*","approval":"prompt"},{"match":"python*subprocess*","approval":"prompt"},{"match":"python*shutil.rmtree*","approval":"prompt"},{"match":"git *","approval":"allow"},{"match":"ssh *","approval":"allow"},{"match":"scp *","approval":"allow"},{"match":"rsync *","approval":"allow"},{"match":"curl *","approval":"allow"},{"match":"cat *","approval":"allow"},{"match":"head *","approval":"allow"},{"match":"tail *","approval":"allow"},{"match":"wc *","approval":"allow"},{"match":"ls *","approval":"allow"},{"match":"du *","approval":"allow"},{"match":"df *","approval":"allow"},{"match":"stat *","approval":"allow"},{"match":"file *","approval":"allow"},{"match":"tree *","approval":"allow"},{"match":"diff *","approval":"allow"},{"match":"cmp *","approval":"allow"},{"match":"jq *","approval":"allow"},{"match":"sed *","approval":"allow"},{"match":"awk *","approval":"allow"},{"match":"tr *","approval":"allow"},{"match":"sort *","approval":"allow"},{"match":"uniq *","approval":"allow"},{"match":"cut *","approval":"allow"},{"match":"paste *","approval":"allow"},{"match":"fold *","approval":"allow"},{"match":"nl *","approval":"allow"},{"match":"od *","approval":"allow"},{"match":"xxd *","approval":"allow"},{"match":"base64 *","approval":"allow"},{"match":"md5sum *","approval":"allow"},{"match":"sha*sum *","approval":"allow"},{"match":"shasum *","approval":"allow"},{"match":"env","approval":"allow"},{"match":"printenv *","approval":"allow"},{"match":"date *","approval":"allow"},{"match":"uname *","approval":"allow"},{"match":"id","approval":"allow"},{"match":"whoami","approval":"allow"},{"match":"hostname *","approval":"allow"},{"match":"which *","approval":"allow"},{"match":"ps *","approval":"allow"},{"match":"pgrep *","approval":"allow"},{"match":"ss *","approval":"allow"},{"match":"lsof *","approval":"allow"},{"match":"dmesg *","approval":"allow"},{"match":"journalctl *","approval":"allow"},{"match":"systemctl status*","approval":"allow"},{"match":"systemctl --user status*","approval":"allow"},{"match":"systemctl is-*","approval":"allow"},{"match":"systemctl --user show*","approval":"allow"},{"match":"realpath *","approval":"allow"},{"match":"readlink *","approval":"allow"},{"match":"basename *","approval":"allow"},{"match":"dirname *","approval":"allow"},{"match":"mkdir *","approval":"allow"},{"match":"touch *","approval":"allow"},{"match":"cp *","approval":"allow"},{"match":"mv *","approval":"allow"},{"match":"ln *","approval":"allow"},{"match":"chmod *","approval":"allow"},{"match":"install *","approval":"allow"},{"match":"./install.sh *","approval":"allow"},{"match":"bash ./install.sh *","approval":"allow"},{"match":"tests/*","approval":"allow"},{"match":"omp *","approval":"allow"},{"match":"omp-local *","approval":"allow"},{"match":"qdbus *","approval":"allow"},{"match":"qdbus6 *","approval":"allow"},{"match":"dbus-send *","approval":"allow"},{"match":"security find-generic-password*","approval":"allow"},{"match":"security add-generic-password*","approval":"allow"},{"match":"pbcopy*","approval":"allow"},{"match":"pbpaste*","approval":"allow"},{"match":"launchctl get*","approval":"allow"},{"match":"launchctl list*","approval":"allow"},{"match":"launchctl print*","approval":"allow"},{"match":"open *","approval":"allow"},{"match":"grep *","approval":"allow"},{"match":"rg *","approval":"allow"},{"match":"fd *","approval":"allow"},{"match":"find *","approval":"allow"},{"match":"strings *","approval":"allow"},{"match":"comm *","approval":"allow"},{"match":"column *","approval":"allow"},{"match":"echo *","approval":"allow"},{"match":"printf *","approval":"allow"},{"match":"true","approval":"allow"},{"match":"false","approval":"allow"},{"match":"test *","approval":"allow"},{"match":"sleep *","approval":"allow"},{"match":"command *","approval":"allow"},{"match":"type *","approval":"allow"},{"match":"hostname","approval":"allow"},{"match":"nproc","approval":"allow"},{"match":"sw_vers *","approval":"allow"},{"match":"zsh -n*","approval":"allow"},{"match":"sh -n*","approval":"allow"},{"match":"tar -tf*","approval":"allow"},{"match":"tar -tzf*","approval":"allow"},{"match":"unzip -l*","approval":"allow"},{"match":"plutil -p*","approval":"allow"},{"match":"plutil -lint*","approval":"allow"},{"match":"plutil -extract*","approval":"allow"},{"match":"tmutil listlocalsnapshots*","approval":"allow"},{"match":"diskutil list*","approval":"allow"},{"match":"diskutil info*","approval":"allow"},{"match":"diskutil apfs list*","approval":"allow"},{"match":"system_profiler *","approval":"allow"},{"match":"scutil --get*","approval":"allow"},{"match":"scutil --dns*","approval":"allow"},{"match":"brew list*","approval":"allow"},{"match":"brew info*","approval":"allow"},{"match":"brew --prefix*","approval":"allow"},{"match":"brew --version","approval":"allow"},{"match":"omz update","approval":"allow"},{"match":"omz reload","approval":"allow"},{"match":"omz version","approval":"allow"},{"match":"omz path","approval":"allow"},{"match":"python3 *","approval":"allow"},{"match":"python *","approval":"allow"},{"match":"cd","approval":"allow"},{"match":"cd *","approval":"allow"}]

# Let `&&` chains be judged per segment against the rules above (literal && only; other
# operators keep whole-command approval). Without it, `git add . && git commit` pays a
# prompt even though both halves are allowed.
bash.allowCompoundCommands true

# Edits and writes under ~/workspace (the fleet's repos) are workspace-write: auto-approved
# in `write` mode instead of prompting because sessions start in a different cwd. Home-dir
# dotfiles (.zprofile, .config edits) still ask.
workspace.additionalDirectories ["~/workspace"]

# Keep each compaction handoff summary on disk so a long session can be audited afterwards.
# The printer session compacted six times; the first fired one minute after the finding
# that turned out to be the root cause, and the finding lost its priority in the summary.
compaction.handoffSaveToDisk true
